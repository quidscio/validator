[build-system]
requires = ["setuptools>=68", "tzdata>=2024.1"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "smtp-recipient-probe"
version = "1.0.0"
description = "Observe SMTP recipient acceptance without submitting an email"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["dnspython>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
smtp-recipient-probe = "smtp_recipient_probe:main"

[tool.setuptools]
py-modules = ["smtp_recipient_probe", "probe_common", "probe_dns", "probe_smtp", "smtp_probe_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
